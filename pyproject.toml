[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcml_moex"
version = "1.0.0"
description = "Empirical de-quantization and norm-controlled spectral audit of Quantum Cognition Machine Learning in an emerging equity market"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Pavel Chuklanov", email = "Chuklanov.pavel@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scikit-learn>=1.5",
    "torch>=2.3",
]

[project.optional-dependencies]
experiments = ["lightgbm>=4.3", "matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/alpha7en/QCML_Emerging_Market"
Archive = "https://doi.org/10.5281/zenodo.24525011"

[tool.setuptools]
packages = ["qcml_moex"]
